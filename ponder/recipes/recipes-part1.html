<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Recipe Book</title>

    <!-- Google Font -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Amatic+SC:wght@700&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="recipes-part1.css">

    <!-- Open Graph -->
    <meta property="og:type" content="website">
    <meta property="og:title" content="Recipe Book">
    <meta property="og:description" content="Browse delicious recipes including desserts, meals, and snacks.">
    <meta property="og:url" content="https://yourwebsite.com">
    <meta property="og:image" content="social-preview-image.png">

    <!-- X Card -->
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="Recipe Book">
    <meta name="twitter:description" content="Browse delicious recipes including desserts, meals, and snacks.">
    <meta name="twitter:image" content="social-preview-image.png">

    
    <!-- Apple Touch Icon -->
    <link rel="apple-touch-icon" href="apple-touch-icon.png">
</head>
<body>

    <header>
        <div class="logo">
            <img src="recipe-book-icon.png" alt="Recipe Book Logo">
            <h1>RecipeBook</h1>
        </div>
    </header>

    <main>

        <div class="search-bar">
            <input type="text" placeholder="Find a recipe">
            <button>
                <img src="search.svg" alt="Search">
            </button>
        </div>

        <section class="recipe-card">

            <img
                class="recipe-image"
                src="apple_crisp.jpg"
                alt="Apple Crisp"
            >

            <div class="recipe-info">
                <span class="category">dessert</span>

                <h2>Apple Crisp</h2>

                <span
                    class="rating"
                    role="img"
                    aria-label="Rating: 4 out of 5 stars"
                >
                    <span aria-hidden="true">⭐</span>
                    <span aria-hidden="true">⭐</span>
                    <span aria-hidden="true">⭐</span>
                    <span aria-hidden="true">⭐</span>
                    <span aria-hidden="true">☆</span>
                </span>

                <p class="description">
                    This apple crisp recipe is a simple yet delicious fall
                    dessert that's great served warm with vanilla ice cream.
                </p>
            </div>

        </section>

    </main>

    <footer>

        <a
            href="https://www.flaticon.com/free-icons/recipe"
            title="recipe icons"
        >
            Recipe icons created by Freepik - Flaticon
        </a>

        <div class="social">
            <!-- Social media icons provided under CC from https://www.iconfinder.com/AlfredoCreates -->
            <a href="#">
                <img src="instagram_icon.svg" alt="Instagram Icon">
            </a>

            <a href="#">
                <img src="youtube_icon.svg" alt="YouTube Icon">
            </a>

            <a href="#">
                <img src="pinterest_icon.svg" alt="Pinterest Icon">
            </a>
        </div>

    </footer>

</body>
</html>

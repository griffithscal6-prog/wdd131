<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>Assign Ability Scores</title>

    <link
        rel="stylesheet"
        href="styles/base.css">

    <script src="scripts/storage.js" defer></script>
    <script src="scripts/dataLoader.js" defer></script>
    <script src="scripts/character.js" defer></script>
    <script src="scripts/abilities.js" defer></script>

</head>

<body>

<header>

    <!-- Logo goes here later -->

    <h1>D&D 5.5e Character Builder</h1>

</header>

<main>

    <h2>Assign Ability Scores</h2>

    <p>

        Each score is generated by rolling four six-sided dice and
        dropping the lowest roll. Assign each generated score to one
        ability before rolling again.

    </p>

    <section class="roll-area">

        <h3>Current Roll</h3>

        <p id="diceDisplay">
            -
        </p>

        <p>

            Total:
            <strong id="scoreDisplay">-</strong>

        </p>

        <button id="rollButton">

            Roll 4d6

        </button>

    </section>

    <hr>

    <section>

        <h3>Select an Ability</h3>

        <div id="abilityButtons">

            <!-- Buttons created by JavaScript -->

        </div>

    </section>

    <hr>

    <section>

        <h3>Assigned Scores</h3>

        <div id="assignedScores">

            <!-- Updated dynamically -->

        </div>

    </section>

    <hr>

    <button
        id="continueButton"
        disabled>

        Continue

    </button>

</main>

<footer>

    <p>

        WDD 131 Final Project

    </p>

</footer>

</body>

</html>
